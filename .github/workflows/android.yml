name: Android

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'Android ABIs (comma separated)'
        required: false
        # For a 64-bit-only build drop 'armeabi-v7a,x86' here (and in ABIS
        # below); the 32-bit ABIs need the gcc-multilib toolchain step below.
        default: 'arm64-v8a,armeabi-v7a,x86,x86_64'
  push:
    branches: [ SDL3, master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ SDL3, master, main ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    env:
      # For a 64-bit-only build use 'arm64-v8a,x86_64' (the gcc-multilib step
      # below can then be dropped).
      ABIS: ${{ inputs.abis || 'arm64-v8a,armeabi-v7a,x86,x86_64' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install NDK, CMake, platform and 32-bit host toolchain
        run: |
          sudo apt-get update
          # 32-bit host toolchain: only needed for the armeabi-v7a/x86 ABIs
          # (LuaJIT's buildvm requires the host and target pointer sizes to
          # match). Not needed for a 64-bit-only build.
          sudo apt-get install -y gcc-multilib libc6-dev-i386
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" \
                        "ndk;27.2.12479018" "cmake;3.31.0"

      # The heavy SDL3 satellite libraries change only when their versions in
      # instead/build.gradle change.
      - name: Cache SDL3
        id: cache-sdl
        uses: actions/cache@v6
        with:
          path: |
            instead/src/main/c/SDL3/SDL3
            instead/src/main/c/SDL3_image/SDL3_image
            instead/src/main/c/SDL3_mixer/SDL3_mixer
            instead/src/main/c/SDL3_ttf/SDL3_ttf
          key: sdl3-${{ runner.os }}-${{ hashFiles('instead/build.gradle') }}

      - name: Download SDL3
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: ./gradlew --no-daemon --build-cache :instead:downloadSdl

      - name: Download INSTEAD, LuaJIT and libiconv
        run: ./gradlew --no-daemon --build-cache :instead:downloadInstead

      - name: Build
        run: ./gradlew --no-daemon --build-cache assembleDebug -PabiFilters="$ABIS"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: instead-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
