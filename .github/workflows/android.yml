name: Android

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'Android ABIs (comma separated)'
        required: false
        default: 'arm64-v8a,armeabi-v7a,x86,x86_64'
  push:
    branches: [ SDL3, master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ SDL3, master, main ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    env:
      ABIS: ${{ inputs.abis || 'arm64-v8a,armeabi-v7a,x86,x86_64' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake, platform and 32-bit host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
                     "ndk;27.2.12479018" "cmake;3.31.0"

      - name: Cache native dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            instead/src/main/c/Instead/Instead
            instead/src/main/c/LuaJIT
            instead/src/main/c/SDL3/SDL3
            instead/src/main/c/SDL3_image/SDL3_image
            instead/src/main/c/SDL3_mixer/SDL3_mixer
            instead/src/main/c/SDL3_ttf/SDL3_ttf
            instead/src/main/c/libiconv/libiconv
            instead/src/main/c/luajit-libs
          key: native-deps-${{ runner.os }}-${{ hashFiles('instead/build.gradle', 'instead/src/main/c/scripts/build-luajit.sh') }}

      - name: Download native dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./gradlew --no-daemon :instead:downloadDependencies

      - name: Build
        run: ./gradlew --no-daemon assembleDebug -PabiFilters="$ABIS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instead-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
