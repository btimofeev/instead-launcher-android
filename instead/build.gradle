plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id "de.undercouch.download" version "5.6.0"
}

android {

    defaultConfig {
        minSdkVersion rootProject.min_sdk_version
        compileSdk rootProject.compile_sdk_version
        targetSdkVersion rootProject.compile_sdk_version

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // LuaJIT can only be cross-built here for 64-bit ABIs.
            abiFilters(*((rootProject.findProperty('abiFilters') ?: 'arm64-v8a,x86_64').toString().split(',')))
        }
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_PLATFORM=android-25", "-DCMAKE_BUILD_TYPE=Release",
                        "-DANDROID_ARM_MODE=arm"
                version "3.31.0"
            }
        }
        lintOptions {
          abortOnError false
        }

        consumerProguardFiles "consumer-rules.pro"
    }

    ndkVersion ndk_version

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField("String", "INSTEAD_VERSION", "\"$rootProject.build_config_instead_version\"")
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
        debug {
            buildConfigField("String", "INSTEAD_VERSION", "\"$rootProject.build_config_instead_version\"")
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs += 'src/main/c/luajit-libs'
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    externalNativeBuild {
        cmake {
            path "src/main/c/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'org.emunix.instead'
}

dependencies {
    implementation project(':core-storage')
    implementation project(':core-preferences')
    implementation project(':sdl-activity')

    implementation libs.androidx.appcompat

    // Kotlin
    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.android

    // DI
    implementation libs.hilt.android
    kapt libs.hilt.compiler
}

tasks.register('deleteDependencies', Delete) {
    delete 'src/main/c/Instead/Instead', 'src/main/c/LuaJIT'
    delete 'src/main/c/luajit-libs'
    delete 'src/main/c/SDL3/SDL3', 'src/main/c/SDL3_image/SDL3_image'
    delete 'src/main/c/SDL3_mixer/SDL3_mixer', 'src/main/c/SDL3_ttf/SDL3_ttf'
    delete 'src/main/c/libiconv/libiconv'
}

tasks.register('downloadInstead') {
    def InsteadRef = 'b755e7f379deda34deb7dbf0e0b5b30d903a1875'
    def LuaJitRef = 'c6ffc141a8762b41703f9287d63d93622a13dd8f'
    def Iconv = '1.15'
    def downloadDir = layout.buildDirectory.get().asFile.path

    doLast {
        delete('src/main/c/Instead/Instead', 'src/main/c/LuaJIT', 'src/main/c/libiconv/libiconv')

        download.run {
            src "https://github.com/instead-hub/instead/archive/${InsteadRef}.tar.gz"
            dest new File(downloadDir, "instead-${InsteadRef}.tar.gz")
        }
        copy {
            from tarTree(resources.gzip("${downloadDir}/instead-${InsteadRef}.tar.gz"))
            into 'src/main/c/Instead/'
        }
        delete("${downloadDir}/instead-${InsteadRef}.tar.gz")
        file("src/main/c/Instead/instead-${InsteadRef}").renameTo(file('src/main/c/Instead/Instead'))
        delete("src/main/c/Instead/instead-${InsteadRef}")

        download.run {
            src "https://github.com/LuaJIT/LuaJIT/archive/${LuaJitRef}.tar.gz"
            dest new File(downloadDir, "LuaJIT-${LuaJitRef}.tar.gz")
        }
        copy {
            from tarTree(resources.gzip("${downloadDir}/LuaJIT-${LuaJitRef}.tar.gz"))
            into 'src/main/c/'
        }
        delete("${downloadDir}/LuaJIT-${LuaJitRef}.tar.gz")
        def luaJitDir = "LuaJIT-${LuaJitRef}"
        file("src/main/c/${luaJitDir}").renameTo(file('src/main/c/LuaJIT'))
        delete("src/main/c/${luaJitDir}")

        download.run {
            src "https://ftp.gnu.org/pub/gnu/libiconv/libiconv-${Iconv}.tar.gz"
            dest downloadDir
        }
        copy {
            from tarTree(resources.gzip("${downloadDir}/libiconv-${Iconv}.tar.gz"))
            into 'src/main/c/libiconv/'
        }
        delete("${downloadDir}/libiconv-${Iconv}.tar.gz")
        file("src/main/c/libiconv/libiconv-${Iconv}").renameTo(file('src/main/c/libiconv/libiconv'))
        delete("src/main/c/libiconv/libiconv-${Iconv}")
    }
}

tasks.register('downloadSdl') {
    def SDL3 = 'release-3.4.10'
    def SDL3_image = 'release-3.4.6'
    def SDL3_mixer = 'release-3.2.4'
    def SDL3_ttf = 'release-3.2.2'
    def downloadDir = layout.buildDirectory.get().asFile.path

    def sdl = [
        [repo: 'SDL',       ref: SDL3,       dest: 'SDL3/SDL3'],
        [repo: 'SDL_image', ref: SDL3_image, dest: 'SDL3_image/SDL3_image'],
        [repo: 'SDL_mixer', ref: SDL3_mixer, dest: 'SDL3_mixer/SDL3_mixer'],
        [repo: 'SDL_ttf',   ref: SDL3_ttf,   dest: 'SDL3_ttf/SDL3_ttf'],
    ]
    def sdlDeps = [
        'SDL3_image/SDL3_image/external':
                [[repo: 'jpeg',    sha: '9db4612eee1913e689f58ce62cd3b8708b290fd3'],
                 [repo: 'libpng',  sha: '4b9e071b2fc4216369372a3ed260d335dd036f15'],
                 [repo: 'libwebp', sha: '0b4545ee8210ff72ec47ab1ad56c2e7460663d11'],
                 [repo: 'zlib',    sha: '0e68590d11e618d60866aa86629fbda128bc068a']],
        'SDL3_mixer/SDL3_mixer/external':
                [[repo: 'flac',   sha: '833a260a7bc29f80899d33e8c1beb2fc56b4905b'],
                 [repo: 'ogg',    sha: '936fdd822a4e4fc963197b3eda931b89b52859a0'],
                 [repo: 'vorbis', sha: 'eefe62244630a2d2c37ba5e6fb1a1fd8ad93ece5'],
                 [repo: 'mpg123', sha: '6e97a7fdf112a950977dad73de10be0d17ddb6b8'],
                 [repo: 'libxmp', sha: '75e85f8a5be65f9f95fb946086bee17da158166f']],
        'SDL3_ttf/SDL3_ttf/external':
                [[repo: 'freetype', sha: '9973564cfa63763a3e4ac67c09147899539b1e07']],
    ]

    doLast {
        def fetchTarball = { owner, repo, ref, destRel ->
            def archive = file("${downloadDir}/${repo}-${ref}.tar.gz")
            def destDir = file("src/main/c/${destRel}")
            delete(destDir)
            download.run {
                src "https://github.com/${owner}/${repo}/archive/${ref}.tar.gz"
                dest archive
            }
            copy {
                from tarTree(resources.gzip(archive))
                into destDir.parentFile
            }
            delete(archive)
            file("${destDir.parentFile}/${repo}-${ref}").renameTo(destDir)
            delete("${destDir.parentFile}/${repo}-${ref}")
        }

        sdl.each { lib -> fetchTarball('libsdl-org', lib.repo, lib.ref, lib.dest) }
        sdlDeps.each { dest, deps ->
            deps.each { dep -> fetchTarball('libsdl-org', dep.repo, dep.sha, "${dest}/${dep.repo}") }
        }
    }
}

tasks.register('downloadDependencies') {
    description = 'Downloads INSTEAD, LuaJIT, libiconv and the SDL3 libraries'
    dependsOn downloadInstead, downloadSdl
}

tasks.register('buildLuaJit') {
    description = 'Builds libluajit.so for the selected ABI(s)'
    def abis = (rootProject.findProperty('abiFilters') ?: 'arm64-v8a,x86_64').toString().split(',') as List
    def script = file('src/main/c/scripts/build-luajit.sh')
    def ljSrc = file('src/main/c/LuaJIT')
    def outDir = file('src/main/c/luajit-libs')
    def workDir = layout.buildDirectory.dir('luajit').get().asFile
    def api = rootProject.min_sdk_version.toString()
    inputs.file(script)
    inputs.dir(ljSrc)
    inputs.property('abis', abis.join(','))
    outputs.dir(outDir)
    doLast {
        if (!new File(ljSrc, 'src/Makefile').exists()) {
            throw new GradleException('LuaJIT sources are missing: run :instead:downloadDependencies first')
        }
        abis.each { abi ->
            exec {
                commandLine 'sh', script.absolutePath, abi,
                        new File(outDir, abi).absolutePath, ljSrc.absolutePath,
                        android.ndkDirectory.absolutePath, workDir.absolutePath, api
            }
        }
    }
}

tasks.register('copyLangs', Copy) {
    description = 'Copies langs from Instead to assets'
    from 'src/main/c/Instead/Instead/lang/'
    into 'src/main/assets/lang/'
    include '*.ini'
}

tasks.register('copyThemes', Copy) {
    description = 'Copies themes from Instead to assets'
    from 'src/main/c/Instead/Instead/themes/'
    into 'src/main/assets/themes/'
    exclude 'CMakeLists.txt', 'Makefile'
}

tasks.register('copyStead', Copy) {
    description = 'Copies stead folder from Instead to assets'
    from 'src/main/c/Instead/Instead/stead/'
    into 'src/main/assets/stead/'
    exclude '**/CMakeLists.txt', 'Makefile'
}

tasks.register('cleanAssets', Delete) {
    delete 'src/main/assets/lang/', 'src/main/assets/themes/', 'src/main/assets/stead/'
}

tasks.register('fdroidRemoveBinaries', Delete) {
    delete 'src/main/c/Instead/Instead/contrib/'
    delete 'src/main/c/SDL3/SDL3/Xcode/'
    delete 'src/main/c/SDL3_image/SDL3_image/Xcode/'
    delete 'src/main/c/SDL3_mixer/SDL3_mixer/Xcode/'
    delete 'src/main/c/SDL3_ttf/SDL3_ttf/Xcode/'
    delete 'src/main/c/libiconv/libiconv/tests/'
}

preBuild.dependsOn copyLangs, copyThemes, copyStead, buildLuaJit

// LuaJIT must exist before the native INSTEAD library is configured/linked.
tasks.configureEach { t ->
    if (t.name.startsWith('configureCMake') || t.name.startsWith('buildCMake')) {
        t.dependsOn 'buildLuaJit'
    }
}

afterEvaluate {
    if (project.hasProperty("packageRelease")) {
        packageRelease.finalizedBy(cleanAssets)
    }
    if (project.hasProperty("packageDebug")) {
        packageDebug.finalizedBy(cleanAssets)
    }
    if (project.hasProperty("clean")) {
        clean.finalizedBy(cleanAssets)
    }
}